# SP Night — Noite Paulista
# A cidade às 3h. O escuro azul-violeta do tokyodark, e o poste de sódio queimando quente por cima.
#
# Generated from the SP Night palette — do not edit by hand.
# https://github.com/sp-night/foot
#
# install: ~/.config/foot/sp_night_noite.ini
# enable:  include=~/.config/foot/sp_night_noite.ini   (in foot.ini; needs foot 1.26 or later)

# foot wants bare RRGGBB, so every value drops the leading #. A key that takes two
# colours reads them as text first, then background.
[colors-dark]
background=151723
foreground=d3d7eb

selection-foreground=d3d7eb
selection-background=272937

cursor=0f101a f2984a

# URL mode. The underline is the link colour; the label to press is loud, dark text
# on the signature colour.
urls=6e92de
jump-labels=0f101a f2984a

# Scrollback search. A hit sits in the match colour; nothing found is an error, so
# it borrows the diagnostic rather than an accent.
search-box-match=0f101a f5c66b
search-box-no-match=0f101a ea5d5d

# The position readout recedes into the deepest surface.
scrollback-indicator=868999 0f101a

# A bell is a warning, not an accent.
flash=f5c66b

# The 16 ANSI colours, normal and bright paired.
regular0=0f101a
bright0=707380
regular1=ea5d5d
bright1=ff716f
regular2=89d093
bright2=9ce4a6
regular3=f5c66b
bright3=ffdc9c
regular4=6e92de
bright4=80a5f2
regular5=b094e2
bright5=c3a7f6
regular6=5dbec4
bright6=71d1d7
regular7=868999
bright7=e7ebff
