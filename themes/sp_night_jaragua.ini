# SP Night — Pico do Jaraguá
# A mesma noite, vista do ponto mais alto da cidade. O escuro do noite girado para o verde da mata fechada — e a torre vermelha e branca acesa no topo.
#
# Generated from the SP Night palette — do not edit by hand.
# https://github.com/sp-night/foot
#
# install: ~/.config/foot/sp_night_jaragua.ini
# enable:  include=~/.config/foot/sp_night_jaragua.ini   (in foot.ini; needs foot 1.26 or later)

# foot wants bare RRGGBB, so every value drops the leading #. A key that takes two
# colours reads them as text first, then background.
[colors-dark]
background=0c100d
foreground=d3dad5

selection-foreground=d3dad5
selection-background=202622

cursor=050806 f2984a

# URL mode. The underline is the link colour; the label to press is loud, dark text
# on the signature colour.
urls=6e92de
jump-labels=050806 f2984a

# Scrollback search. A hit sits in the match colour; nothing found is an error, so
# it borrows the diagnostic rather than an accent.
search-box-match=050806 f5c66b
search-box-no-match=050806 ea5d5d

# The position readout recedes into the deepest surface.
scrollback-indicator=868b87 050806

# A bell is a warning, not an accent.
flash=f5c66b

# The 16 ANSI colours, normal and bright paired.
regular0=050806
bright0=707471
regular1=ea5d5d
bright1=ff716f
regular2=79d488
bright2=8ce99b
regular3=f5c66b
bright3=ffdc9c
regular4=6e92de
bright4=80a5f2
regular5=b094e2
bright5=c3a7f6
regular6=60bfb8
bright6=73d2cb
regular7=868b87
bright7=e7eee9
