# SP Night — Garoa
# A mesma janela, vista através do chuvisco. Cinza chapado — a garoa não esfria a cidade, ela desbota.
#
# Generated from the SP Night palette — do not edit by hand.
# https://github.com/sp-night/foot
#
# install: ~/.config/foot/sp_night_garoa.ini
# enable:  include=~/.config/foot/sp_night_garoa.ini   (in foot.ini; needs foot 1.26 or later)

# foot wants bare RRGGBB, so every value drops the leading #. A key that takes two
# colours reads them as text first, then background.
[colors-dark]
background=1c1e20
foreground=c7cdd6

selection-foreground=c7cdd6
selection-background=313436

cursor=151719 e3a068

# URL mode. The underline is the link colour; the label to press is loud, dark text
# on the signature colour.
urls=7993cb
jump-labels=151719 e3a068

# Scrollback search. A hit sits in the match colour; nothing found is an error, so
# it borrows the diagnostic rather than an accent.
search-box-match=151719 e7cb8a
search-box-no-match=151719 d87676

# The position readout recedes into the deepest surface.
scrollback-indicator=8d949f 151719

# A bell is a warning, not an accent.
flash=e7cb8a

# The 16 ANSI colours, normal and bright paired.
regular0=151719
bright0=767d88
regular1=d87676
bright1=ed8988
regular2=9acaa2
bright2=addeb5
regular3=e7cb8a
bright3=fbdf9d
regular4=7993cb
bright4=8ba6df
regular5=af97d3
bright5=c2aae7
regular6=77babf
bright6=8acdd2
regular7=8d949f
bright7=dae1ea
